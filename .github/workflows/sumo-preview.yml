# Временный workflow: SUMO для разработки и проверка эксперимента. Отчёт — в ветку sumo-preview-report.
name: SUMO preview (temporary)

on:
  push:
    branches: [sumo-preview]

permissions:
  contents: write

jobs:
  sumo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: OSM facts about candidate intersections
        run: |
          mkdir -p report
          python sumo/tools/osm_probe.py --restrictions 42.877856 74.562291 > report/restrictions.json 2> report/restrictions.log || true
          python sumo/tools/osm_probe.py --geometry 42.877856 74.562291 > report/geometry.json 2> report/geometry.log || true
      - if: always()
        run: |
          cd report
          git init -q -b sumo-preview-report
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "report $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" sumo-preview-report
