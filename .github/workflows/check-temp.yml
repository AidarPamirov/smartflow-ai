# Временный: сборка, тесты и скриншоты страниц до публикации. Отчёт — в ветку audit-check-report.
name: Check (temporary)
on:
  push:
    branches: [audit-check]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: mkdir -p report && (npm run build > report/build.txt 2>&1; echo "build exit $?" >> report/build.txt)
      - run: (npm test > report/test.txt 2>&1; echo "test exit $?" >> report/test.txt)
      - name: screenshots
        run: |
          npx vite preview --port 4173 --strictPort > /dev/null 2>&1 &
          mkdir -p shot && cd shot && npm init -y > /dev/null && npm install playwright@1.47.2 > /dev/null && npx playwright install --with-deps chromium > /dev/null
          cat > s.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch({ args: ['--use-angle=swiftshader', '--enable-unsafe-swiftshader', '--ignore-gpu-blocklist'] });
          const log = [];
          const p = await b.newPage({ viewport: { width: 1400, height: 900 } });
          p.on('console', (m) => { if (m.type() === 'error') log.push('console: ' + m.text()); });
          p.on('pageerror', (e) => log.push('pageerror: ' + e.message));
          await p.goto('http://localhost:4173/#sumo', { waitUntil: 'networkidle' });
          await p.waitForTimeout(4000);
          await p.screenshot({ path: '../report/sumo-full.png', fullPage: true });
          for (const t of ['адаптивный − фикс. под нагрузку']) {
            const btn = p.locator('button', { hasText: t }).first();
            if (await btn.count()) { await btn.click(); await p.waitForTimeout(500); await btn.screenshot({ path: '../report/pair-btn.png' }); }
          }
          await p.goto('http://localhost:4173/#cv', { waitUntil: 'networkidle' });
          await p.waitForTimeout(3000);
          await p.screenshot({ path: '../report/cv-full.png', fullPage: true });
          const m = await b.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 2 });
          m.on('pageerror', (e) => log.push('phone pageerror: ' + e.message));
          await m.goto('http://localhost:4173/#sumo', { waitUntil: 'networkidle' });
          await m.waitForTimeout(3000);
          await m.screenshot({ path: '../report/sumo-phone.png', fullPage: true });
          await b.close();
          (await import('fs')).writeFileSync('../report/log.txt', log.join('\n'));
          JS
          node s.mjs || echo "script failed" >> ../report/log.txt
      - if: always()
        run: |
          cd report
          git init -q -b audit-check-report
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "report $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" audit-check-report
