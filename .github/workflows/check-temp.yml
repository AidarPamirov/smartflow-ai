# Временный: сборка, тесты и скриншоты режима «час пик» до публикации. Отчёт — в ветку sumo-check-report.
name: Check (temporary)
on:
  push:
    branches: [sumo-check]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: screenshots
        run: |
          npx vite preview --port 4173 --strictPort > /dev/null 2>&1 &
          mkdir -p shot report && cd shot && npm init -y > /dev/null && npm install playwright@1.47.2 > /dev/null && npx playwright install --with-deps chromium > /dev/null
          cat > s.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch({ args: ['--use-angle=swiftshader', '--enable-unsafe-swiftshader', '--ignore-gpu-blocklist'] });
          const log = [];
          const p = await b.newPage({ viewport: { width: 1600, height: 950 } });
          p.on('console', (m) => { if (m.type() === 'error') log.push('console: ' + m.text()); });
          p.on('pageerror', (e) => log.push('pageerror: ' + e.message));
          await p.goto('http://localhost:4173/#rush=morning', { waitUntil: 'networkidle' });
          await p.waitForSelector('text=утренний пик', { timeout: 90000 });
          await p.waitForFunction(() => document.body.innerText.includes('¾ поездок'), null, { timeout: 90000 });
          await p.locator('.traffic-seg button', { hasText: '10×' }).click();
          await p.waitForTimeout(45000);
          await p.screenshot({ path: '../report/rush-baseline.png' });
          log.push('baseline: ' + (await p.locator('.traffic-stats').innerText()));
          await p.locator('button', { hasText: 'Adaptive AI' }).first().click();
          await p.waitForTimeout(45000);
          await p.screenshot({ path: '../report/rush-adaptive.png' });
          log.push('adaptive: ' + (await p.locator('.traffic-stats').innerText()));
          await p.locator('.traffic-seg button', { hasText: 'обычный' }).click();
          await p.waitForTimeout(25000);
          log.push('uniform: ' + (await p.locator('.traffic-stats').innerText()));
          await p.screenshot({ path: '../report/uniform.png' });
          const m = await b.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 2 });
          await m.goto('http://localhost:4173/#rush=evening', { waitUntil: 'networkidle' });
          await m.waitForTimeout(20000);
          await m.screenshot({ path: '../report/phone.png' });
          await b.close();
          (await import('fs')).writeFileSync('../report/log.txt', log.join('\n'));
          JS
          node s.mjs || echo "script failed" >> ../report/log.txt
      - if: always()
        run: |
          cd report
          git init -q -b sumo-check-report
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "report $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" sumo-check-report
