name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  sumo:
    # Транспортная модель: геометрия, фазы, безопасность и воспроизводимость прогонов в настоящем SUMO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install eclipse-sumo==1.28.0 traci==1.28.0 sumolib==1.28.0
      - run: python -m unittest discover -s tests -t . -v
        working-directory: sumo
        env:
          SMARTFLOW_REQUIRE_SUMO: '1'

  vision:
    # Модули компьютерного зрения: геометрия, скорость, линия, трекер, ремень, конвейер на синтетической сцене, тестовое видео
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r vision/requirements.txt
      - run: python -m unittest discover -s tests -t . -v
        working-directory: vision

  deploy:
    needs: [build, sumo, vision]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
